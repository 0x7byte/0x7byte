name: Refresh Profile Assets

on:
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image renderer
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - name: Refresh public code footprint
        run: python3 scripts/generate_code_footprint.py
      - uses: Platane/snk@v3
        with:
          github_user_name: 0x7byte
          outputs: |
            assets/contribution-snake-light.svg?palette=github-light
            assets/contribution-snake-dark.svg?palette=github-dark
      - name: Commit refreshed profile assets when they change
        run: |
          git config user.name "0x7byte profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force assets/code-footprint-light.png assets/code-footprint-dark.png assets/contribution-snake-light.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No profile asset changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile assets"
          git push
