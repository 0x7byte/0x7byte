name: Synchronize Professional Public Profile

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install snake animation renderer
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Verify contribution Snake renderer
        run: python3 scripts/test_snake.py
      - name: Synchronize professional public profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_profile.py
      - name: Generate contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Verify generated Snake SVGs
        run: |
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
      - name: Publish Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit only genuine public GitHub changes
        run: |
          git config user.name "0x7byte profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contribution-snake.gif
          if git diff --cached --quiet; then
            echo "No public profile, repository, language, pin, or activity changes to synchronize."
            exit 0
          fi
          git commit -m "chore: synchronize professional public profile"
          git push
