name: Refresh Profile Animation

on:
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: 0x7byte
          outputs: |
            assets/contribution-snake-light.svg?palette=github-light
            assets/contribution-snake-dark.svg?palette=github-dark
      - name: Commit refreshed animation when it changes
        run: |
          if git diff --quiet; then
            echo "No contribution animation changes to commit."
            exit 0
          fi
          git config user.name "0x7byte profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake-light.svg assets/contribution-snake-dark.svg
          git commit -m "chore: refresh contribution animation"
          git push
