name: Synchronize Public Profile

on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install contribution graph renderer
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - name: Synchronize public account data into README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_profile.py
      - name: Commit synchronized profile when account data changes
        run: |
          git config user.name "0x7byte profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force README.md assets/contribution-mix-light.png assets/contribution-mix-dark.png
          if git diff --cached --quiet; then
            echo "No public account changes to synchronize."
            exit 0
          fi
          git commit -m "chore: synchronize public profile"
          git push
