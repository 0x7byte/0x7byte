name: Refresh Dynamic Profile Assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-profile-assets.mjs"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate public-data profile assets
        run: node scripts/generate-profile-assets.mjs
      - name: Commit refreshed assets when data changed
        run: |
          if git diff --quiet; then
            echo "No public profile changes to commit."
            exit 0
          fi
          git config user.name "0x7byte profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/observatory-light.svg assets/observatory-dark.svg
          git commit -m "chore: refresh public profile observatory"
          git push
