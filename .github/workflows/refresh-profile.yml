name: Synchronize Professional Public Profile

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install snake animation renderer
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Synchronize professional public profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_profile.py
      - name: Commit only genuine public GitHub changes
        run: |
          git config user.name "0x7byte profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contribution-snake.gif
          if git diff --cached --quiet; then
            echo "No public profile, repository, language, pin, or activity changes to synchronize."
            exit 0
          fi
          git commit -m "chore: synchronize professional public profile"
          git push
