name: Refresh Live Profile

on:
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh live profile text
        run: python3 scripts/refresh_live_readme.py
      - uses: Platane/snk@v3
        with:
          github_user_name: 0x7byte
          outputs: |
            assets/contribution-snake-light.svg?palette=github-light
            assets/contribution-snake-dark.svg?palette=github-dark
      - name: Commit refreshed profile when data changes
        run: |
          git config user.name "0x7byte profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force README.md assets/contribution-snake-light.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No profile data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh live profile data"
          git push
